name: Android APK

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArbeitszeitGeofence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          mkdir -p app/signing
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/signing/release.jks

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload signed release APK artifact
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArbeitszeitGeofence-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release (once per version, only if release notes exist)
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          TAG="v${VERSION_NAME}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Keine Release-Notes fuer ${TAG} - kein Release."
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} existiert bereits - nichts zu tun."
            exit 0
          fi
          ASSET="ArbeitszeitGeofence-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Arbeitszeit Geofence ${TAG}" \
            --notes-file "$NOTES_FILE" \
            --latest
