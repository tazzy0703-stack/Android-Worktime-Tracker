name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate release keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p keystore-output

          keytool \
            -genkeypair \
            -v \
            -keystore keystore-output/arbeitszeit-release.jks \
            -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -alias "$ANDROID_KEY_ALIAS" \
            -dname "CN=Kai Becker, OU=Private, O=ArbeitszeitGeofence, L=Neukirchen-Vluyn, ST=NRW, C=DE"

      - name: Create Base64 value
        run: |
          base64 -w 0 keystore-output/arbeitszeit-release.jks > keystore-output/ANDROID_KEYSTORE_BASE64.txt

      - name: Export certificate info
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool \
            -list \
            -v \
            -keystore keystore-output/arbeitszeit-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > keystore-output/certificate-info.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore-generated-once
          path: keystore-output/
          if-no-files-found: error
